# deployctl 규칙에 맞춘 최소 형태 (규칙 4-1: dbnet 참여, 규칙 5-1: 127.0.0.1 바인딩).
services:
  app:
    build: .
    image: upload-prj:local
    restart: unless-stopped
    # 도커 볼륨 대신 저장소 안 ./data 로 바인드 마운트한다. 컨테이너를
    # 호스트 사용자(1000:1000)로 돌려서 파일이 root 소유가 되지
    # 않고 sudo 없이 바로 열어볼 수 있게 한다.
    user: "1000:1000"
    # 접근 토큰. 값은 저장소가 아니라 ~/srv/upload-prj/.env 에 둔다.
    environment:
      UPLOAD_TOKEN: ${UPLOAD_TOKEN:?UPLOAD_TOKEN 이 필요합니다}
    ports:
      # 호스트 Caddy가 이 포트로 프록시한다. app.json 의 port 와 같아야 한다.
      - "127.0.0.1:9002:8000"
    volumes:
      - ./data:/app/data
    networks: [default, dbnet]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  # DB를 쓰지 않지만 deployctl validate가 모든 사이트에 dbnet 참여를 요구한다 (규칙 4-1).
  dbnet:
    external: true
