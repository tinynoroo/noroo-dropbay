# deployctl 규칙에 맞춘 최소 형태 (규칙 4-1: dbnet 참여, 규칙 5-1: 127.0.0.1 바인딩).
services:
  app:
    build: .
    image: upload-prj:local
    restart: unless-stopped
    ports:
      # 호스트 Caddy가 이 포트로 프록시한다. app.json 의 port 와 같아야 한다.
      - "127.0.0.1:9002:8000"
    volumes:
      - uploads-data:/app/data
    networks: [default, dbnet]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  uploads-data:

networks:
  # DB를 쓰지 않지만 deployctl validate가 모든 사이트에 dbnet 참여를 요구한다 (규칙 4-1).
  dbnet:
    external: true
