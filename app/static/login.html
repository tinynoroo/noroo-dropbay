<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cloud · 로그인</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f6fb;
    --surface: #ffffff;
    --border: #e2e6f0;
    --text: #1a1d29;
    --text-dim: #6b7280;
    --accent: #4f6df5;
    --danger: #e5484d;
    --shadow: 0 1px 2px rgba(20, 24, 40, .04), 0 8px 24px rgba(20, 24, 40, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1117;
      --surface: #171a23;
      --border: #2a2e3a;
      --text: #eef0f6;
      --text-dim: #9096a8;
      --accent: #7b91ff;
      --danger: #ff6b6f;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .35);
    }
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Pretendard, Roboto, "Noto Sans KR", sans-serif;
    margin: 0;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
  }
  form {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 28px 24px;
    width: 100%;
    max-width: 340px;
  }
  h1 { font-size: 19px; margin: 0 0 4px; }
  p { font-size: 13px; color: var(--text-dim); margin: 0 0 20px; }
  input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: transparent;
    color: var(--text);
    font-size: 14px;
  }
  input:focus { outline: 2px solid var(--accent); border-color: transparent; }
  button {
    width: 100%;
    margin-top: 12px;
    background: var(--accent);
    color: white;
    border: none;
    padding: 10px;
    border-radius: 9px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  #error { color: var(--danger); font-size: 13px; margin: 10px 0 0; display: none; }
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>Cloud</h1>
  <p>비밀번호를 입력하세요</p>
  <input type="password" name="password" autocomplete="current-password" required autofocus />
  <div id="error">비밀번호가 맞지 않습니다.</div>
  <button type="submit">로그인</button>
</form>
<script>
  if (new URLSearchParams(location.search).has('e')) document.getElementById('error').style.display = 'block';
</script>
</body>
</html>
